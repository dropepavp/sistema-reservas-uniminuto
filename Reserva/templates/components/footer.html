<style>

    /* Overlay de carga */
    #global-loading-overlay {
        display: none;

        background: rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(3px);
        z-index: 9998;
        align-items: center;

        flex-direction: column;

    }
    #global-loading-overlay.active { display: flex; }

    .loading-card {
        background: white;

        padding: 2rem 2.5rem;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        min-width: 200px;

    .loading-spinner-ring {
        width: 48px; height: 48px;
        border: 4px solid #e5e7eb;
        border-top-color: #2d6a9f;
        border-radius: 50%;
        animation: spin-ring 0.8s linear infinite;
        margin: 0 auto 1rem;
    }

    @keyframes spin-ring { to { transform: rotate(360deg); } }

    .loading-card p {
        margin: 0;
        color: #374151;
        font-size: 0.95rem;
        font-weight: 500;
    }

    /* Toast container */
    #toast-container {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-width: 340px;
    }

    .ui-toast {
        background: white;
        border-radius: 12px;
        padding: 0.85rem 1.1rem;
        box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        animation: toast-in 0.3s ease;
        border-left: 4px solid #6b7280;
        font-size: 0.875rem;
    }

    .ui-toast.success { border-left-color: #16a34a; }
    .ui-toast.danger  { border-left-color: #dc2626; }
    .ui-toast.warning { border-left-color: #d97706; }
    .ui-toast.info    { border-left-color: #2563eb; }

    .ui-toast .toast-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 1px; }
    .ui-toast.success .toast-icon { color: #16a34a; }
    .ui-toast.danger  .toast-icon { color: #dc2626; }

    .ui-toast .toast-msg { flex: 1; color: #1f2937; line-height: 1.4; }

    }

        to   { opacity: 1; transform: translateX(0); }

    }
</style>

<script>
window.LoadingUI = (function () {
    const overlay   = document.getElementById('global-loading-overlay');
    const msgEl     = document.getElementById('loading-message');
    const progressBar = document.getElementById('global-progress-bar');
    const toastContainer = document.getElementById('toast-container');

    let progressTimer = null;

    function startProgress() {
        let w = 0;
        progressBar.style.width = '0%';
        progressBar.style.opacity = '1';
        progressTimer = setInterval(() => {
            w = w < 85 ? w + (Math.random() * 8) : w + 0.5;
            if (w > 95) w = 95;
            progressBar.style.width = w + '%';
        }, 200);
    }

    function endProgress() {
        clearInterval(progressTimer);
        progressBar.style.width = '100%';
        setTimeout(() => {
            progressBar.style.opacity = '0';
            setTimeout(() => { progressBar.style.width = '0%'; progressBar.style.opacity = '1'; }, 300);
        }, 300);
    }

    const icons = { success: 'bi-check-circle-fill', danger: 'bi-x-circle-fill', warning: 'bi-exclamation-triangle-fill', info: 'bi-info-circle-fill' };

    return {
        show(msg = 'Procesando...') {
            msgEl.textContent = msg;
            overlay.classList.add('active');
            startProgress();
        },
        hide() {
            overlay.classList.remove('active');
            endProgress();
        },
        progress() { startProgress(); },
        progressDone() { endProgress(); },
        toast(msg, type = 'info', duration = 4000) {
            const t = document.createElement('div');
            t.className = `ui-toast ${type}`;
            t.innerHTML = `
                <i class="bi ${icons[type] || 'bi-info-circle-fill'} toast-icon"></i>
                <span class="toast-msg">${msg}</span>
                <button class="toast-close" aria-label="Cerrar"><i class="bi bi-x"></i></button>`;
            toastContainer.appendChild(t);
            t.querySelector('.toast-close').onclick = () => removeToast(t);
            if (duration > 0) setTimeout(() => removeToast(t), duration);
        },
        btnLoading(btn, loading, loadingText = 'Procesando...') {
            if (!btn) return;
            if (loading) {
                btn._originalHTML = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status"></span>${loadingText}`;
            } else {
                btn.disabled = false;
                if (btn._originalHTML) btn.innerHTML = btn._originalHTML;
            }
        }
    };

    function removeToast(t) {
        t.style.animation = 'toast-out 0.3s ease forwards';
        setTimeout(() => t.remove(), 300);
    }
})();

// Mostrar barra de progreso en navegación entre páginas
document.addEventListener('click', function (e) {
    const link = e.target.closest('a[href]');
    if (!link) return;
    const href = link.getAttribute('href');
    if (!href || href.startsWith('#') || href.startsWith('javascript') || link.target === '_blank') return;
    if (e.ctrlKey || e.metaKey || e.shiftKey) return;
    LoadingUI.progress();
});
</script>

<script>
    // Funciones JavaScript comunes
    function establecerFechaActual(inputId) {
        const hoy = new Date();
        const fechaFormateada = hoy.toISOString().split('T')[0];
        document.getElementById(inputId).value = fechaFormateada;
    }

    function establecerHoraActual(inputId) {
        const ahora = new Date();
        const horas = ahora.getHours().toString().padStart(2, '0');
        const minutos = ahora.getMinutes().toString().padStart(2, '0');
        document.getElementById(inputId).value = `${horas}:${minutos}`;
    }

    function validarHora(inicioId, finId) {
        const inicio = document.getElementById(inicioId).value;
        const fin = document.getElementById(finId).value;

        if (inicio && fin) {
            const [h1, m1] = inicio.split(':').map(Number);
            const [h2, m2] = fin.split(':').map(Number);

            if (h2 < h1 || (h2 === h1 && m2 <= m1)) {
                alert('La hora de fin debe ser mayor que la hora de inicio');
                return false;
            }
        }
        return true;
    }
</script>
