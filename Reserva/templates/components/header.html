    <!-- Anti-FOUC: aplicar tema guardado ANTES de renderizar la página -->
    <script>
    (function() {
        var theme = localStorage.getItem('appTheme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', theme);
    })();
    </script>

    <!-- CSRF: interceptor global para fetch — debe estar antes de cualquier otro script -->
    <script>
    (function() {
        const _fetch = window.fetch;
        window.fetch = function(url, options) {
            options = options || {};
            const method = (options.method || 'GET').toUpperCase();
            if (['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
                const token = document.querySelector('meta[name="csrf-token"]')?.content;
                if (token) {
                    options.headers = options.headers || {};
                    if (options.headers instanceof Headers) {
                        if (!options.headers.has('X-CSRFToken')) options.headers.set('X-CSRFToken', token);
                    } else {
                        options.headers['X-CSRFToken'] = options.headers['X-CSRFToken'] || token;
                    }
                }
            }
            return _fetch.call(this, url, options);
        };
    })();
    </script>
    <style>
        /* Estilo para el cursor en los encabezados colapsables */
        .card-header[data-bs-toggle="collapse"] {
            cursor: pointer;
        }

        /* Rotación del ícono de chevron en los encabezados colapsables */
        .card-header[data-bs-toggle="collapse"] .bi-chevron-down {
            transition: transform 0.2s ease-in-out;
        }

        .card-header[data-bs-toggle="collapse"][aria-expanded="true"] .bi-chevron-down {
            transform: rotate(180deg);
        }

        /* Asegura que la tabla no rompa el texto y fuerce el scroll horizontal */
        .table {
            white-space: nowrap;
        }

        /* Ajustes para DataTables con scroll */
        .dataTables_wrapper.dt-bootstrap5 .row {
            width: 100%;
            margin-left: 0;
            margin-right: 0;
        }
    </style>
