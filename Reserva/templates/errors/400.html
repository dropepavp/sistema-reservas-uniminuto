{% include 'components/header.html' %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
            <h1 class="mt-3">400 — Solicitud incorrecta</h1>
            <p class="text-muted">La solicitud no pudo ser procesada. Verifica los datos enviados.</p>
            {% if error and error.description %}
            <div class="alert alert-warning py-2 mb-3 small d-inline-block">
                <i class="bi bi-info-circle me-1"></i> {{ error.description }}
            </div>
            {% endif %}
            <div class="d-flex justify-content-center gap-2 mt-3">
                <button type="button" class="btn btn-outline-secondary" onclick="window.history.back()">
                    <i class="bi bi-arrow-left me-1"></i> Regresar
                </button>
                <a href="/" class="btn btn-primary">
                    <i class="bi bi-house me-1"></i> Volver al inicio
                </a>
            </div>
        </div>
    </div>
</div>

{% include 'components/footer.html' %}
